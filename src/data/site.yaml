biography:
  paragraphs:
    - I am a Ph.D. student in the Institute of Artificial Intelligence and Robotics (IAIR) at Xi'an Jiaotong University, supervised by Prof. Ping Wei. I received my M.S. degree from Huazhong University of Science and Technology, supervised by Assoc. Prof. Gang Peng.
    - My research interests focus on robotics, embodied intelligence, multimodal learning, and video understanding. I aspire to develop AI technologies that genuinely benefit society.
    - Welcome to contact me for any discussion and cooperation.
  interests:
    - Robotics
    - Embodied Intelligence
    - Multimodal Learning
    - Video Understanding

research:
  title: Multimodal Intelligence for Embodied Systems
  lead: I explore unmanned systems and embodied agents that perceive scenes, understand multimodal signals, and plan reliable actions under challenging real-world conditions.
  image: /assets/research/project-overview-2023.png
  imageAlt: Research overview of intelligent perception and prediction
  directions:
    - title: Imaging
      body: Reliable multimodal signal acquisition for RGB, event, depth, LiDAR, and robot state.
    - title: Perception
      body: Discriminative representations for temporal grounding, manipulation, and scene understanding.
    - title: Understanding
      body: Reasoning with multimodal large models, task-driven feedback, and embodied knowledge.
    - title: Planning
      body: Robotic action planning, trajectory optimization, and real-world challenge systems.
